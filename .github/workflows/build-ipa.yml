name: Build Celeste iOS IPA

on:
  push:
    branches:
      - celeste-ios-build
  workflow_dispatch:
    inputs:
      publish_device_test_ipa:
        description: Upload a non-certified IPA to the private device-test release for on-device testing
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: celeste-ios-build
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/celeste-ios-build'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Apply iOS Everest hook integration
        run: git -C Everest apply ../patches/Everest-ios.patch

      - name: Initialize Everest build dependencies
        run: git -C Everest submodule update --init --recursive

      - name: Apply the iOS MonoMod runtime fix
        run: git -C Everest/external/MonoMod apply ../../../patches/MonoMod-ios.patch

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.428
            9.0.x
            10.0.x
            11.0.100

      - name: Check Mono strong-name utility on the pinned runner
        shell: bash
        run: command -v sn

      - name: Run typed hook compatibility smoke tests
        working-directory: ${{ runner.temp }}
        run: dotnet run --configuration Release --project "$GITHUB_WORKSPACE/tools/IOSHookWeaver.SmokeTests/IOSHookWeaver.SmokeTests.csproj"

      - name: Run iOS mod dependency smoke tests
        working-directory: ${{ runner.temp }}
        run: dotnet run --configuration Release --project "$GITHUB_WORKSPACE/tools/IOSModLibrarySmoke/IOSModLibrarySmoke.csproj"

      - name: Prepare portable ILSpy CLI for the macOS build
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/ilspycmd-tools"
          mkdir -p "$tool_dir"
          # The Linux x64 `ilspycmd` pointer now selects a Native AOT package.
          # The macOS build job needs the framework-dependent, portable tool payload.
          dotnet tool install --tool-path "$tool_dir" ilspycmd.any --version 11.2.0.10050
          tool_dll="$(find "$tool_dir/.store" -type f -iname 'ilspycmd.dll' -print -quit)"
          if [ -z "$tool_dll" ]; then
            echo "The portable ILSpy command assembly was not installed." >&2
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/ilspycmd-portable.tar.gz" -C "$tool_dir" .store

      - uses: actions/upload-artifact@v4
        with:
          name: celeste-ios-ilspycmd
          path: ${{ runner.temp }}/ilspycmd-portable.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Package tested managed runtime for simulator smoke
        run: |
          set -euo pipefail
          test -s Everest/Celeste.Mod.mm/bin/Release/net8.0/Celeste.Mod.mm.dll
          test -s Everest/Celeste.Mod.mm/bin/Release/net8.0/MonoMod.RuntimeDetour.dll
          test -s Everest/Celeste.Mod.mm/bin/Release/net8.0/MonoMod.Utils.dll
          test -s Everest/external/NLua/lib/Release/net8.0/NLua.dll
          nuget_global_packages="$(dotnet nuget locals global-packages --list | sed -n 's/^global-packages: //p' | tr -d '\r')"
          for package_assembly in \
            monomod.backports/1.1.2/lib/net8.0/MonoMod.Backports.dll \
            monomod.ilhelpers/1.1.0/lib/net8.0/MonoMod.ILHelpers.dll; do
            if [ -z "$nuget_global_packages" ] || [ ! -s "$nuget_global_packages/$package_assembly" ]; then
              echo "The iOS runtime smoke dependency is missing from the NuGet cache: $package_assembly" >&2
              exit 1
            fi
            cp -f "$nuget_global_packages/$package_assembly" Everest/Celeste.Mod.mm/bin/Release/net8.0/
          done
          tar -czf "$RUNNER_TEMP/everest-managed-smoke.tar.gz" \
            Everest/Celeste.Mod.mm/bin/Release/net8.0/*.dll \
            Everest/external/NLua/lib/Release/net8.0/NLua.dll

      - uses: actions/upload-artifact@v4
        with:
          name: celeste-ios-managed-smoke
          path: ${{ runner.temp }}/everest-managed-smoke.tar.gz
          if-no-files-found: error
          retention-days: 1

  build:
    needs: verify
    if: github.ref == 'refs/heads/celeste-ios-build'
    runs-on: macos-26-intel
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Apply iOS Everest hook integration
        run: git -C Everest apply ../patches/Everest-ios.patch

      - name: Initialize Everest build dependencies
        run: git -C Everest submodule update --init --recursive

      - name: Apply the iOS MonoMod runtime fix
        run: git -C Everest/external/MonoMod apply ../../../patches/MonoMod-ios.patch

      - uses: actions/download-artifact@v4
        with:
          name: celeste-ios-managed-smoke
          path: ${{ runner.temp }}

      - uses: actions/download-artifact@v4
        with:
          name: celeste-ios-ilspycmd
          path: ${{ runner.temp }}/ilspycmd-portable

      - name: Restore portable ILSpy CLI
        shell: bash
        run: |
          set -euo pipefail
          portable_dir="$RUNNER_TEMP/ilspycmd-portable"
          tar -xzf "$portable_dir/ilspycmd-portable.tar.gz" -C "$portable_dir"
          tool_dll="$(find "$portable_dir/.store" -type f -iname 'ilspycmd.dll' -print -quit)"
          if [ -z "$tool_dll" ]; then
            echo "The portable ILSpy command assembly was not restored." >&2
            exit 1
          fi
          echo "ILSPYCMD_DLL=$tool_dll" >> "$GITHUB_ENV"

      - name: Restore tested managed runtime for simulator smoke
        run: tar -xzf "$RUNNER_TEMP/everest-managed-smoke.tar.gz" -C "$GITHUB_WORKSPACE"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.428
            9.0.x
            10.0.x
            11.0.100

      - name: Install Mono strong-name utility when needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sn >/dev/null 2>&1; then
            brew install mono
          fi
          command -v sn

      - name: Check required private secrets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_STORAGE_TOKEN }}
          CACHE_KEY: ${{ secrets.GAME_CACHE_KEY }}
          PRIVATE_STORAGE_REPO: hbashton/celeste-ios-ci-temp-20261120
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Add the PRIVATE_STORAGE_TOKEN Actions secret before starting a build." >&2
            exit 1
          fi
          if ! [[ "${CACHE_KEY:-}" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo "The GAME_CACHE_KEY Actions secret is missing or invalid." >&2
            exit 1
          fi
          if ! gh api "repos/$PRIVATE_STORAGE_REPO/releases/tags/celeste-input" --jq '.tag_name' >/dev/null 2>&1; then
            echo "PRIVATE_STORAGE_TOKEN cannot read the private input release. Check that its resource owner is hbashton, its repository selection includes celeste-ios-ci-temp-20261120, and Contents has read access." >&2
            exit 1
          fi

      - name: Restore encrypted private input cache
        id: private-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/celeste-ios-private-input-cache
          key: celeste-ios-private-inputs-v1

      - name: Download and encrypt private inputs on cache miss
        if: steps.private-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_STORAGE_TOKEN }}
          CACHE_KEY: ${{ secrets.GAME_CACHE_KEY }}
        run: |
          set -euo pipefail
          storage_repo="hbashton/celeste-ios-ci-temp-20261120"
          download_dir="$RUNNER_TEMP/celeste-ios-private-downloads"
          cache_dir="$RUNNER_TEMP/celeste-ios-private-input-cache"
          mkdir -p "$download_dir" "$cache_dir"

          gh release download celeste-input --repo "$storage_repo" --pattern 'celeste-game-input.tar' --dir "$download_dir"
          gh release download celeste-input --repo "$storage_repo" --pattern 'celeste-fmod-ios.tar' --dir "$download_dir"
          gh release download celeste-input --repo "$storage_repo" --pattern 'celeste-private-overrides.tar' --dir "$download_dir"

          for name in celeste-game-input celeste-fmod-ios celeste-private-overrides; do
            gzip -1 -c "$download_dir/$name.tar" > "$download_dir/$name.tar.gz"
            node tools/cache-crypto.mjs encrypt \
              "$download_dir/$name.tar.gz" \
              "$cache_dir/$name.tar.gz.enc"
          done
          rm -rf "$download_dir"

      - name: Save encrypted private input cache
        if: steps.private-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/celeste-ios-private-input-cache
          key: celeste-ios-private-inputs-v1

      - name: Decrypt private inputs
        shell: bash
        env:
          CACHE_KEY: ${{ secrets.GAME_CACHE_KEY }}
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/celeste-ios-private-input-cache"
          game_tar="$RUNNER_TEMP/celeste-game-input.tar.gz"
          fmod_tar="$RUNNER_TEMP/celeste-fmod-ios.tar.gz"
          overrides_tar="$RUNNER_TEMP/celeste-private-overrides.tar.gz"
          node tools/cache-crypto.mjs decrypt "$cache_dir/celeste-game-input.tar.gz.enc" "$game_tar"
          node tools/cache-crypto.mjs decrypt "$cache_dir/celeste-fmod-ios.tar.gz.enc" "$fmod_tar"
          node tools/cache-crypto.mjs decrypt "$cache_dir/celeste-private-overrides.tar.gz.enc" "$overrides_tar"

          mkdir -p "$RUNNER_TEMP/celeste-ios-game-input" "$RUNNER_TEMP/celeste-ios-fmod"
          tar -xzf "$game_tar" -C "$RUNNER_TEMP/celeste-ios-game-input"
          tar -xzf "$fmod_tar" -C "$RUNNER_TEMP/celeste-ios-fmod"
          tar -xzf "$overrides_tar" -C "$GITHUB_WORKSPACE"
          rm -f "$game_tar" "$fmod_tar" "$overrides_tar"

      - name: Check game and FMOD inputs
        id: input-paths
        shell: bash
        run: |
          set -euo pipefail
          game_root="$RUNNER_TEMP/celeste-ios-game-input"
          fmod_root="$RUNNER_TEMP/celeste-ios-fmod"
          game_exe="$(find "$game_root" -type f -name Celeste.exe -print -quit)"
          if [ -z "$game_exe" ]; then
            echo 'Celeste.exe was not found in the private input package.' >&2
            exit 1
          fi
          game_dir="$(dirname "$game_exe")"
          for file in System.Core.dll System.Xml.dll Celeste.Content.dll; do
            if [ ! -f "$game_dir/$file" ]; then
              echo "Missing $file in the private game input package." >&2
              exit 1
            fi
          done
          for lib in libfmod_iphoneos.a libfmodstudio_iphoneos.a; do
            if ! find "$fmod_root" -type f -name "$lib" -print -quit | grep -q .; then
              echo "Missing FMOD iOS library: $lib" >&2
              exit 1
            fi
          done
          for patch in patches/remove-steam.patch patches/remove-steam2.patch; do
            if [ ! -s "$patch" ]; then
              echo "Missing private build patch: $patch" >&2
              exit 1
            fi
          done
          game_hash="$(shasum -a 256 "$game_exe" | cut -d' ' -f1)"
          echo "game_dir=$game_dir" >> "$GITHUB_OUTPUT"
          echo "fmod_root=$fmod_root" >> "$GITHUB_OUTPUT"
          echo "game_hash=$game_hash" >> "$GITHUB_OUTPUT"

      - name: Cache .NET packages and tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/tools
          key: celeste-dotnet-${{ runner.os }}-${{ steps.input-paths.outputs.game_hash }}-${{ hashFiles('celestemeow/*.csproj', 'celestemeow.sln', 'global.json', 'celestemeow/IOSHook*.cs', 'celestemeow/IOSILHookRuntime.cs', 'tools/IOSHookWeaver/*.cs', 'tools/IOSHookWeaver.SmokeTests/**/*.cs', 'tools/IOSHookWeaver.SmokeTests/**/*.csproj', 'tools/IOSInterpreterSmoke/**/*.cs', 'tools/IOSInterpreterSmoke/**/*.csproj', 'tools/IOSNativeImportPatcher/*.cs', 'patches/Everest-ios.patch', 'patches/MonoMod-ios.patch') }}-ilspy-11.2.0.10050

      - name: Install .NET 11 iOS workload
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          sdk9_version="$(dotnet --list-sdks | awk '$1 ~ /^9\./ { version=$1 } END { print version }')"
          sdk11_version="$(dotnet --list-sdks | awk '$1 == "11.0.100" { print $1 }')"
          if [ -z "$sdk9_version" ]; then
            echo 'The .NET 9 SDK required by the Everest build and hook compatibility tests is missing.' >&2
            exit 1
          fi
          if [ -z "$sdk11_version" ]; then
            echo 'The .NET 11 SDK required by the CoreCLR iOS app is missing.' >&2
            exit 1
          fi
          sdk8_version="$(dotnet --list-sdks | awk '$1 == "8.0.428" { print $1 }')"
          if [ -z "$sdk8_version" ]; then
            echo 'The .NET 8.0.428 SDK required to run the net8 hook compatibility tools is missing.' >&2
            exit 1
          fi
          dotnet_path="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$(command -v dotnet)")"
          dotnet_root="$(dirname "$dotnet_path")"
          host_arch="$(uname -m)"
          case "$host_arch" in
            arm64)
              dotnet_runtime_arch=arm64
              simulator_rid=iossimulator-arm64
              dotnet_root_arm64="$dotnet_root"
              ;;
            x86_64)
              dotnet_runtime_arch=x64
              simulator_rid=iossimulator-x64
              dotnet_root_arm64=""
              ;;
            *)
              echo "Unsupported macOS runner architecture: $host_arch" >&2
              exit 1
              ;;
          esac
          echo "Using host architecture $host_arch, .NET runtime $dotnet_runtime_arch, and simulator target $simulator_rid"
          echo "DOTNET_ROOT=$dotnet_root" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_RID=$simulator_rid" >> "$GITHUB_ENV"
          export DOTNET_ROOT="$dotnet_root"
          if [ -n "$dotnet_root_arm64" ]; then
            echo "DOTNET_ROOT_ARM64=$dotnet_root_arm64" >> "$GITHUB_ENV"
            export DOTNET_ROOT_ARM64="$dotnet_root_arm64"
          else
            unset DOTNET_ROOT_ARM64 || true
          fi
          printf '{"sdk":{"version":"%s","rollForward":"latestPatch"}}\n' "$sdk11_version" > "$RUNNER_TEMP/global.json"
          echo "Checking iOS workload for .NET SDK $sdk11_version"
          dotnet --version
          if ! dotnet workload list | grep -Eq '(^|[[:space:]])ios([[:space:]]|$)'; then
            dotnet workload install ios --skip-manifest-update
          fi
          # Hook compatibility tests use .NET 9; the iOS app and runtime smoke
          # use .NET 11 CoreCLR so Reflection.Emit executes through its MSIL interpreter.
          printf '{"sdk":{"version":"%s","rollForward":"latestPatch"}}\n' "$sdk9_version" > "$RUNNER_TEMP/global.json"
          if ! dotnet --list-runtimes | grep -Eq '^Microsoft.NETCore.App 6\.0\.'; then
            curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
            bash "$RUNNER_TEMP/dotnet-install.sh" --runtime dotnet --version 6.0.36 --architecture "$dotnet_runtime_arch" --install-dir "$DOTNET_ROOT"
          fi
          if [ ! -d "$DOTNET_ROOT/shared/Microsoft.NETCore.App/6.0.36" ]; then
            echo 'The .NET 6 runtime required by the compatibility tools was not installed.' >&2
            exit 1
          fi
          xcodebuild -version

      - name: Verify woven hooks on the iOS interpreter
        working-directory: ${{ runner.temp }}
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          run_with_timeout() {
            python3 - "$1" "${@:2}" <<'PY'
          import os
          import signal
          import subprocess
          import sys

          seconds = float(sys.argv[1])
          command = sys.argv[2:]
          process = subprocess.Popen(command, start_new_session=True)
          try:
              result = process.wait(timeout=seconds)
          except subprocess.TimeoutExpired:
              print(f"::error::Timed out after {seconds:g}s: {' '.join(command)}", file=sys.stderr)
              os.killpg(process.pid, signal.SIGTERM)
              try:
                  process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  os.killpg(process.pid, signal.SIGKILL)
                  process.wait()
              sys.exit(124)
          sys.exit(result)
          PY
          }
          printf '{"sdk":{"version":"11.0.100","rollForward":"latestPatch"}}\n' > "$RUNNER_TEMP/global.json"
          # Reuse the managed runtime built and tested by the verify job. These assemblies are
          # architecture-neutral, and rebuilding Everest/NLua on this constrained simulator
          # runner needlessly doubles compilation memory.
          smoke_project="$GITHUB_WORKSPACE/tools/IOSInterpreterSmoke/IOSInterpreterSmoke.csproj"
          fixture_project="$GITHUB_WORKSPACE/tools/IOSInterpreterSmoke/ProbeFixture/ProbeFixture.csproj"
          native_import_fixture="$GITHUB_WORKSPACE/tools/IOSHookWeaver.SmokeTests/NativePInvokeFixture/NativePInvokeFixture.csproj"
          dotnet build "$fixture_project" --configuration Release -m:1 -p:BuildInParallel=false -p:UseSharedCompilation=false
          dotnet build "$native_import_fixture" --configuration Release -m:1 -p:BuildInParallel=false -p:UseSharedCompilation=false
          dotnet build "$smoke_project" --configuration Release -r "$IOS_SIMULATOR_RID" -m:1 -p:BuildInParallel=false -p:UseSharedCompilation=false -p:BuildProjectReferences=false
          app_path="$(find "$GITHUB_WORKSPACE/tools/IOSInterpreterSmoke/bin/Release/net11.0-ios" -maxdepth 3 -type d -name 'IOSInterpreterSmoke.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo 'The iOS interpreter smoke app bundle was not produced.' >&2
            exit 1
          fi
          # simctl can spend several minutes starting CoreSimulator on a fresh macOS runner.
          device_list="$(run_with_timeout 300 xcrun simctl list devices available -j)"
          device_id="$(printf '%s' "$device_list" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for xs in d["devices"].values() for x in xs if x.get("isAvailable") and x["name"].startswith("iPhone")), ""))')"
          if [ -z "$device_id" ]; then
            echo 'No available iPhone simulator was found on the runner.' >&2
            exit 1
          fi
          bundle_id='gay.rooot.celestemeow.smoke'
          codesign --verify --deep --strict "$app_path"
          run_with_timeout 60 xcrun simctl boot "$device_id" 2>/dev/null || true
          # Fresh Xcode images can spend several minutes migrating the first iOS simulator boot.
          run_with_timeout 420 xcrun simctl bootstatus "$device_id" -b
          run_with_timeout 120 xcrun simctl install "$device_id" "$app_path"
          app_data="$(run_with_timeout 180 xcrun simctl get_app_container "$device_id" "$bundle_id" data)"
          result_path="$app_data/Documents/ios-interpreter-smoke.txt"
          launch_status=0
          run_with_timeout 60 xcrun simctl launch "$device_id" "$bundle_id" || launch_status=$?
          if (( launch_status != 0 )); then
            echo "simctl launch did not return successfully (exit $launch_status); checking the app result file and simulator logs."
          fi
          for attempt in $(seq 1 300); do
            if grep -qx 'PASS' "$result_path" 2>/dev/null || grep -q '^FAIL' "$result_path" 2>/dev/null; then break; fi
            if (( attempt % 30 == 0 )); then
              echo "Still waiting for the iOS interpreter smoke (attempt $attempt/300); latest progress:"
              if [ -s "$result_path" ]; then cat "$result_path"; else echo 'The app has not written its progress file.'; fi
            fi
            sleep 1
          done
          if [ ! -s "$result_path" ]; then
            run_with_timeout 60 xcrun simctl spawn "$device_id" log show --last 5m --style compact --predicate 'eventMessage CONTAINS[c] "IOSInterpreterSmoke" OR process == "ReportCrash"' || true
            crash_report="$(find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -iname '*IOSInterpreterSmoke*' -print 2>/dev/null | tail -n 1)"
            if [ -n "$crash_report" ]; then
              tail -n 160 "$crash_report"
            fi
            echo 'The iOS interpreter smoke app did not write a result.' >&2
            exit 1
          fi
          cat "$result_path"
          if ! grep -qx 'PASS' "$result_path"; then
            run_with_timeout 60 xcrun simctl spawn "$device_id" log show --last 5m --style compact --predicate 'eventMessage CONTAINS[c] "IOSInterpreterSmoke" OR process == "ReportCrash"' || true
            crash_report="$(find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -iname '*IOSInterpreterSmoke*' -print 2>/dev/null | tail -n 1)"
            if [ -n "$crash_report" ]; then
              tail -n 160 "$crash_report"
            fi
            echo 'The iOS interpreter smoke did not finish with PASS; see its last progress or failure output above.' >&2
            exit 1
          fi
          run_with_timeout 30 xcrun simctl terminate "$device_id" "$bundle_id" || true
          run_with_timeout 30 xcrun simctl shutdown "$device_id" || true

      - name: Apply native library cache patch
        shell: bash
        run: git -C fnalibs-ios-builder-celeste apply ../patches/fnalibs-ios-disable-opengl.patch

      - name: Prepare native library cache key
        id: native-revisions
        shell: bash
        run: |
          set -euo pipefail
          builder_revision="$(git -C fnalibs-ios-builder-celeste rev-parse HEAD)"
          fna_revision="$(git -C FNA rev-parse HEAD)"
          native_input_hash="${{ hashFiles('build.sh', 'patches/FAudio-static-alignment.patch', 'patches/SDL-gamecontroller.patch', 'patches/FNA-FNA3D-renderer.patch', 'patches/fnalibs-ios-disable-opengl.patch', 'patches/Theorafile-VidPlayer.patch', 'fnalibs-ios-builder-celeste/buildlibs.sh', 'fnalibs-ios-builder-celeste/updatelibs.sh') }}"
          cache_key="celeste-ios-native-controller-only-v2-fna-24.01-$builder_revision-$fna_revision-$native_input_hash"
          legacy_cache_key=""
          # This exact managed-game rebuild changes no native inputs. Reuse the
          # last successful native cache once, then the new key is saved below.
          if [[ "$native_input_hash" == "f1388c0418f745a8fe5eadeccd8141450e89bdcb9c902e4615da2932f7ff8468" ]]; then
            legacy_cache_key="celeste-ios-native-controller-only-v2-fna-24.01-$builder_revision-$fna_revision-84927a069a4dfc7c59bf6e44dda42ff5eebe74f6aea881f6205fa9c75e7349b7"
          fi
          echo "builder=$builder_revision" >> "$GITHUB_OUTPUT"
          echo "fna=$fna_revision" >> "$GITHUB_OUTPUT"
          echo "cache_key=$cache_key" >> "$GITHUB_OUTPUT"
          echo "legacy_cache_key=$legacy_cache_key" >> "$GITHUB_OUTPUT"

      - name: Restore compiled iOS native libraries
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: fnalibs-ios-builder-celeste/release/ios/device
          key: ${{ steps.native-revisions.outputs.cache_key }}
          restore-keys: |
            ${{ steps.native-revisions.outputs.legacy_cache_key }}
            celeste-ios-native-controller-only-v2-fna-24.01-${{ steps.native-revisions.outputs.builder }}-${{ steps.native-revisions.outputs.fna }}-

      - name: Check cached native libraries
        id: native-libraries
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          for lib in libSDL2.a libFNA3D.a libFAudio.a libtheorafile.a libMoltenVK.a; do
            if [ ! -s "fnalibs-ios-builder-celeste/release/ios/device/$lib" ]; then
              ready=false
            fi
          done
          echo "use_cache=$ready" >> "$GITHUB_OUTPUT"

      - name: Build unsigned iOS package
        shell: bash
        env:
          GAME_DIR: ${{ steps.input-paths.outputs.game_dir }}
          FMOD_ROOT: ${{ steps.input-paths.outputs.fmod_root }}
          USE_CACHED_NATIVE_LIBS: ${{ steps.native-libraries.outputs.use_cache }}
          ENABLE_VIRTUAL_CONTROLLER: '0'
          CELESTE_GAME_INPUT_IN_PLACE: '1'
        run: |
          set -euo pipefail
          fmod_lowlevel="$(find "$FMOD_ROOT" -type f -name libfmod_iphoneos.a -print -quit)"
          fmod_studio="$(find "$FMOD_ROOT" -type f -name libfmodstudio_iphoneos.a -print -quit)"
          cp "$fmod_lowlevel" celestemeow/libfmod.a
          cp "$fmod_studio" celestemeow/libfmodstudio.a
          git config --global url.https://github.com/.insteadOf git://github.com/
          printf '%s\ny\n' "$GAME_DIR" | ./build.sh

      - name: Check native libraries for cache
        id: native-ready
        if: always()
        shell: bash
        run: |
          ready=true
          for lib in libSDL2.a libFNA3D.a libFAudio.a libtheorafile.a libMoltenVK.a; do
            if [ ! -s "fnalibs-ios-builder-celeste/release/ios/device/$lib" ]; then
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Save compiled iOS native libraries
        if: always() && steps.native-cache.outputs.cache-hit != 'true' && steps.native-ready.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: fnalibs-ios-builder-celeste/release/ios/device
          key: ${{ steps.native-revisions.outputs.cache_key }}

      - name: Store IPA in private release
        if: vars.CELESTE_MOD_COMPATIBILITY_VERIFIED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output_repo="$GITHUB_REPOSITORY"
          output_tag="celeste-ios-build-output"
          if ! gh release view "$output_tag" --repo "$output_repo" >/dev/null 2>&1; then
            gh release create "$output_tag" \
              --repo "$output_repo" \
              --title "Latest Celeste iOS IPA" \
              --notes "Private build output. Replaced by each successful run." \
              --target "$GITHUB_REF_NAME"
          fi
          gh release upload "$output_tag" "$GITHUB_WORKSPACE/celestemeow.ipa" \
            --repo "$output_repo" \
            --clobber

      - name: Store IPA in private device-test release
        if: github.event_name == 'push' || inputs.publish_device_test_ipa == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output_repo="$GITHUB_REPOSITORY"
          output_tag="celeste-ios-device-test-output"
          if ! gh release view "$output_tag" --repo "$output_repo" >/dev/null 2>&1; then
            gh release create "$output_tag" \
              --repo "$output_repo" \
              --title "Celeste iOS device-test build" \
              --notes "Private, non-certified device-test IPA. This build is for collecting on-device compatibility results and does not represent full mod compatibility." \
              --target "$GITHUB_REF_NAME"
          fi
          gh release upload "$output_tag" "$GITHUB_WORKSPACE/celestemeow.ipa" \
            --repo "$output_repo" \
            --clobber

      - name: Preserve matching iOS crash symbols
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output_repo="$GITHUB_REPOSITORY"
          output_tag="celeste-ios-build-output"
          if ! gh release view "$output_tag" --repo "$output_repo" >/dev/null 2>&1; then
            gh release create "$output_tag" \
              --repo "$output_repo" \
              --title "Latest Celeste iOS IPA and crash symbols" \
              --notes "Private build output. The IPA remains gated on completed compatibility verification; matching dSYM archives are retained for device crash reports." \
              --target "$GITHUB_REF_NAME"
          fi
          symbol_dir="$(find "$GITHUB_WORKSPACE/celestemeow/bin" -type d -name 'ci-ios.app.dSYM' -print -quit)"
          if [ -z "$symbol_dir" ]; then
            echo "No ci-ios.app.dSYM directory was generated."
            exit 1
          fi
          dwarf_file="$symbol_dir/Contents/Resources/DWARF/ci-ios"
          if [ ! -s "$dwarf_file" ]; then
            echo "The ci-ios.dSYM bundle has no DWARF symbol file."
            exit 1
          fi
          xcrun dwarfdump --uuid "$dwarf_file"
          symbol_archive="$RUNNER_TEMP/ci-ios-symbols-$GITHUB_RUN_ID.zip"
          ditto -c -k --keepParent "$symbol_dir" "$symbol_archive"
          gh release upload "$output_tag" "$symbol_archive" --repo "$output_repo"

      - name: Remove private build files from the runner
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/celeste-ios-private-downloads" \
            "$RUNNER_TEMP/celeste-ios-private-input-cache" \
            "$RUNNER_TEMP/celeste-ios-game-input" \
            "$RUNNER_TEMP/celeste-ios-fmod" \
            "$GITHUB_WORKSPACE/_celeste_game" \
            "$GITHUB_WORKSPACE/_celeste_decomp" \
            "$GITHUB_WORKSPACE/celeste" \
            "$GITHUB_WORKSPACE/everest-runtime" \
            "$GITHUB_WORKSPACE/Everest/Celeste.Mod.mm/bin" \
            "$GITHUB_WORKSPACE/Everest/Celeste.Mod.mm/obj" \
            "$GITHUB_WORKSPACE/celestemeow/Content" \
            "$GITHUB_WORKSPACE/celestemeow/RuntimeAssemblies" \
            "$GITHUB_WORKSPACE/celestemeow/bin" \
            "$GITHUB_WORKSPACE/celestemeow/obj"
          rm -f \
            "$RUNNER_TEMP/celeste-game-input.tar.gz" \
            "$RUNNER_TEMP/celeste-fmod-ios.tar.gz" \
            "$RUNNER_TEMP/celeste-private-overrides.tar.gz" \
            "$GITHUB_WORKSPACE/celestemeow.ipa" \
            "$GITHUB_WORKSPACE/ios-native-imports.txt" \
            "$GITHUB_WORKSPACE/ios-native-exports.txt" \
            "$GITHUB_WORKSPACE/patches/remove-steam.patch" \
            "$GITHUB_WORKSPACE/patches/remove-steam2.patch"
